name: Generate PlantUML Diagrams

on:
  push:
    paths:
      - '**.puml'
      - '.github/workflows/plantuml.yml'

jobs:
  render-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Download PlantUML
        run: |
          curl -L https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar -o plantuml.jar

      - name: Generate diagrams and move to img/
        run: |
          mkdir -p img
          find . -name '*.puml' | while read file; do
            name=$(basename "$file" .puml)
            java -jar plantuml.jar "$file"
            mv "${file%.puml}.png" "img/$name.png" || echo "No output for $file"
          done

      - name: Commit and push generated images
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add img/*.png
          git commit -m "Auto-generated PlantUML diagrams" || echo "No changes to commit"
          git push
